[project]
name = "gmail-calendar-mcp"
version = "0.1.0"
description = "MCP server: Gmail + Google Calendar tools (no send, no delete)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "tzdata",
]
